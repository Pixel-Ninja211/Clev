# Builds Clev into signed-ready Windows installers on every tag push.
name: build-clev-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clev-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "clev-desktop/src-tauri" }
      - name: Install frontend deps
        run: npm ci || npm install
      - name: Build NSIS + MSI bundles
        run: npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: clev-windows-installers
          path: |
            clev-desktop/src-tauri/target/release/bundle/nsis/*.exe
            clev-desktop/src-tauri/target/release/bundle/msi/*.msi
