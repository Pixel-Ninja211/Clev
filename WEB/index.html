<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CLEV AI HUD - a neon cyberpunk terminal homepage with a Gemini-powered assistant, ElevenLabs voice, live system feed, speed-dial bookmarks, and NEOMO the desktop pet." />
    <meta name="theme-color" content="#06b6d4" />
    <title>CLEV // ARTIFICIAL INTELLIGENCE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23000'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%2306b6d4' font-family='monospace' font-weight='bold'%3EC%3C/text%3E%3Ccircle cx='79' cy='23' r='9' fill='%2306b6d4'%3E%3Canimate attributeName='opacity' values='1;0.2;1' dur='1.5s' repeatCount='indefinite'/%3E%3C/circle%3E%3C/svg%3E" />

    <!-- 1. RETRO PIXEL FONT + MODERN MONO -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- 2. TAILWIND CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 3. INLINE TAILWIND CONFIG (Includes Pixel Font) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              pixel: ['"VT323"', 'monospace'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            colors: {
              cyan: {
                500: '#06b6d4',
              }
            }
          }
        }
      }
    </script>

    <!-- 4. CRT SCANLINE EFFECT -->
    <style>
      @keyframes gridScroll {
        from { background-position: 0 0, 0 0; }
        to { background-position: 0 48px, 48px 0; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.82; }
        94% { opacity: 1; }
        97% { opacity: 0.9; }
      }
      body { animation: flicker 9s infinite; }
      .crt-overlay {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        opacity: 0.15;
        background: linear-gradient(
            rgba(18, 16, 16, 0) 50%, 
            rgba(0, 0, 0, 0.5) 50%
          ), 
          linear-gradient(
            90deg, 
            rgba(255, 0, 0, 0.06), 
            rgba(0, 255, 0, 0.02), 
            rgba(0, 0, 255, 0.06)
          );
        background-size: 100% 4px, 3px 100%;
      }
    </style>
  </head>
  <body class="bg-black text-white antialiased font-pixel text-xl tracking-wider selection:bg-cyan-500 selection:text-black">
    <div class="crt-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
